    https://kishore-naik.dev • Liquid Glass Portfolio
  </text>
  
  <!-- Mockup UI Inner Elements -->
  <!-- Glass Card 1 -->
  <rect x="90" y="130" width="280" height="150" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(0,210,255,0.3)" stroke-width="1"/>

      <stop offset="0%" stop-color="#090e1c"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="pBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#pGrad)"/>
  
  <!-- Browser Chrome Mockup -->
  <rect x="50" y="50" width="700" height="400" rx="16" fill="#0d1424" stroke="url(#pBorder)" stroke-width="2"/>
  

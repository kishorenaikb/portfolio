<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="interBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a18"/>
      <stop offset="100%" stop-color="#03040c"/>
    </linearGradient>
    <linearGradient id="interGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#interBg)"/>
  
  <!-- Subtle Background Rings -->
  <circle cx="300" cy="190" r="140" fill="none" stroke="#2e1065" stroke-width="2" stroke-dasharray="8,8"/>
  <circle cx="300" cy="190" r="90" fill="none" stroke="url(#interGrad)" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Book / Science Flask Motif -->
  <g transform="translate(300, 190)">
    <polygon points="-50,50 50,50 20,-40 -20,-40" fill="#0f172a" stroke="url(#interGrad)" stroke-width="3"/>
    <rect x="-15" y="-65" width="30" height="25" fill="#0f172a" stroke="url(#interGrad)" stroke-width="2"/>
    <circle cx="0" cy="20" r="15" fill="#a855f7" opacity="0.3"/>
  </g>
  
  <!-- Info Card Overlay -->
  <rect x="50" y="340" width="500" height="115" rx="16" fill="#0f172a" stroke="url(#interGrad)" stroke-width="1.5" opacity="0.95"/>
  <text x="300" y="375" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    INTERMEDIATE PHOTO SLOT
  </text>
  <text x="300" y="400" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">
    APTWR College of Excellence (Boys)
  </text>
  <text x="300" y="425" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
    Yerragondapalem, Prakasam District • English Medium
  </text>
</svg>

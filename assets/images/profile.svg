<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Subtle background tech grid -->
  <circle cx="300" cy="270" r="180" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="300" cy="270" r="230" fill="none" stroke="#00d2ff" stroke-width="1" opacity="0.2"/>
  
  <!-- Stylized Developer Silhouette -->
  <g id="avatar">
    <!-- Glow aura -->
    <circle cx="300" cy="250" r="110" fill="#00d2ff" opacity="0.08" filter="url(#glow)"/>
    <!-- Head -->
    <circle cx="300" cy="240" r="85" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="3"/>
    <!-- Tech specs / visor line -->
    <rect x="235" y="225" width="130" height="18" rx="9" fill="#00d2ff" opacity="0.7"/>
    <!-- Shoulders / Torso -->
    <path d="M160 560 C160 410, 440 410, 440 560 Z" fill="#1e293b" stroke="url(#cyanGrad)" stroke-width="3"/>
    <path d="M220 560 L220 450 L380 450 L380 560 Z" fill="#0f172a" opacity="0.5"/>
  </g>
  
  <!-- Typography & Badge -->
  <rect x="150" y="610" width="300" height="50" rx="25" fill="#0f172a" stroke="#00d2ff" stroke-width="1.5"/>
  <text x="300" y="642" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    KISHORE NAIK
  </text>
  <text x="300" y="685" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#00d2ff" text-anchor="middle" letter-spacing="0.5">
    3rd Year B.Tech CSE Student
  </text>
  <text x="300" y="708" font-family="'Inter', -apple-system, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    Gokula Krishna College of Engineering
  </text>
</svg>
